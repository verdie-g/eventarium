name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Eventarium.slnx

      - name: Build
        run: dotnet build Eventarium.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Eventarium.slnx --configuration Release --no-build
