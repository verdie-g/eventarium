<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <meta name="application-name" content="Eventarium" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eventarium" />
    <meta property="og:description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Eventarium" />
    <meta name="twitter:description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <title>Eventarium</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot-screen" role="status" aria-label="Loading Eventarium">
            <svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                <path d="M5 3.25a2.75 2.75 0 1 1-1.5 5.056v7.388A2.751 2.751 0 1 1 5 20.75a2.75 2.75 0 0 1-1.5-5.056V8.306A2.751 2.751 0 0 1 5 3.25Zm0 1.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm0 12a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z" />
                <path d="M6.5 6a.75.75 0 0 1 .75-.75h2.5A6.25 6.25 0 0 1 16 11.5v1.194a2.751 2.751 0 1 1-1.5 0V11.5a4.75 4.75 0 0 0-4.75-4.75h-2.5A.75.75 0 0 1 6.5 6Zm9.5 8a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z" />
            </svg>
            <span>Loading the forge</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        The activity stream stopped unexpectedly.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">Close</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
