<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <meta name="application-name" content="Eventarium" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eventarium" />
    <meta property="og:description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Eventarium" />
    <meta name="twitter:description" content="Eventarium turns live development activity (commits, issues, pull requests, reviews, comments) into an animated, real-time visualization." />
    <title>Eventarium</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="eventarium.svg" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot-screen" role="status" aria-label="Loading Eventarium">
            <img class="brand-mark" src="eventarium.svg" alt="" width="128" height="128" />
            <span>Loading the forge</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        The activity stream stopped unexpectedly.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">Close</button>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
